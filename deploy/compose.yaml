services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: kultur
      POSTGRES_DB: kultur
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - pgdata:/var/lib/postgresql
      - /run/secrets/pg_password:/run/secrets/pg_password:ro
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

volumes:
  pgdata: