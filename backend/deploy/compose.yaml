services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: kultur
      POSTGRES_DB: kultur
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - pgdata:/var/lib/postgresql
      - /etc/kulturprogramm/pg_password:/run/secrets/pg_password:ro
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kultur", "-d", "kultur"]
      interval: 5s
      retries: 10

  scraper:
    build: ../scraper
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: kultur
      PGDATABASE: kultur
      PGPASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    depends_on:
      postgres:
        condition: service_healthy

  # Writes the context notes (see backend/enricher/main.py). Started by hand,
  # like the scraper; update.sh rebuilds only the frontend.
  enricher:
    build: ../enricher
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: kultur
      PGDATABASE: kultur
      PGPASSWORD_FILE: /run/secrets/pg_password
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
    secrets:
      - pg_password
      - openrouter_api_key
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ../../frontend
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: kultur
      PGDATABASE: kultur
      PGPASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # Database admin in the browser. Only reachable on the server itself (not
  # from the internet): open an SSH tunnel, then http://localhost:5050 (see
  # AGENTS.md). Started by hand; update.sh rebuilds only the frontend.
  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kulturprogramm.eu  # the login name, no mail is sent
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
    secrets:
      - pgadmin_password
    volumes:
      - pgadmin:/var/lib/pgadmin  # account, settings, saved connections
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy

secrets:
  pg_password:
    file: /etc/kulturprogramm/pg_password
  # read by the container user pgadmin (UID 5050): chown 5050 on the host
  pgadmin_password:
    file: /etc/kulturprogramm/pgadmin_password
  # an OpenRouter API key (openrouter.ai/keys); set a credit limit on the key
  openrouter_api_key:
    file: /etc/kulturprogramm/openrouter_api_key

volumes:
  pgdata:
  pgadmin:
