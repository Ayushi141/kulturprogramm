# Deploys the frontend to the VPS after every push to main.
#
# The job packs the pushed commit as a tar archive and sends it over SSH. The
# server restricts the deploy key to one command that unpacks the archive and
# runs backend/deploy/deploy.sh (see that file for the authorized_keys line).
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   DEPLOY_SSH_KEY      private key of the deploy key pair
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan <host>` (checks the server's identity)
#   DEPLOY_TARGET       user@host, or ssh://user@host:port for a different SSH port
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running deploy to finish.
concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Send the code to the server and run deploy.sh
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_TARGET }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          git archive --format=tar.gz HEAD |
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$TARGET"
