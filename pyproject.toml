[project]
name = "kulturprogramm"
version = "1.0.0"
description = "Scraper and enricher behind kulturprogramm.eu, a culture programme for NRW"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.15"
dependencies = [
    "beautifulsoup4>=4.13",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.black]
line-length = 80
